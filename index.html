<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTranslate</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="shell" id="shell">
      <div class="bar">
        <svg class="bar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h9M8.5 3v2M6 5c.8 3.2 3 5.6 6 7M11 5c-.9 3.7-3.4 6.6-7 8" />
          <path d="M13 21l4-9 4 9M14.4 18h5.2" />
        </svg>
        <textarea
          id="q"
          rows="1"
          placeholder="Çevrilecek metni yaz…"
          spellcheck="false"
          autocomplete="off"
        ></textarea>
        <span class="badge" id="dir" hidden></span>
        <button class="icon-btn" id="gear" title="Ayarlar" aria-label="Ayarlar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
            <circle cx="16" cy="7" r="2" />
            <circle cx="10" cy="17" r="2" />
          </svg>
        </button>
        <div class="progress" id="progress"></div>
      </div>

      <section class="result" id="result" hidden>
        <p class="out" id="out" title="Kopyalamak için tıkla"></p>
        <div class="meta" id="meta">
          <span><kbd>Ctrl</kbd><kbd>Enter</kbd> kopyala</span>
          <span><kbd>Tab</kbd> yön değiştir</span>
          <span><kbd>Esc</kbd> kapat</span>
        </div>
      </section>

      <p class="error" id="error" hidden></p>

      <section class="settings" id="settings" hidden>
        <div class="row">
          <label for="key">DeepL API anahtarı</label>
          <input id="key" type="password" spellcheck="false" autocomplete="off" />
        </div>
        <div class="row">
          <label for="shortcut">Kısayol</label>
          <button class="recorder" id="shortcut" type="button"></button>
        </div>
        <div class="row">
          <label for="autostart">Windows ile başlat</label>
          <label class="switch">
            <input id="autostart" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="actions">
          <span class="settings-msg" id="settings-msg"></span>
          <button class="primary" id="save" type="button">Kaydet</button>
        </div>
      </section>
    </main>
  </body>
</html>
